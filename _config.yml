title: flores electronics # name of the site
# author: Riccardo Graziosi # name of site's author
# email: riccardo.graziosi97@gmail.com # email of site's author
url: https://floreselectronics.com # root address of the site
baseurl: "" # subpath of the site, e.g. "/blog" (leave it blank "" if you're site shouldn't use a subpath)
description: > # description of the site (multiple lines allowed)
  instruments, pedals and synth design by hugo and daniel flores garcía

# landing-page taglines (the page shows one language at a time, see _layouts/home.html)
tagline_en: "instruments : pedals : synths : un taller familiar"
tagline_es: "un taller familiar de instrumentos : pedales : sintes"

# TODO: swap for the flores electronics address once it exists (gmail or hola@floreselectronics.com via porkbun forwarding)
contact_email: mail@hugofloresgarcia.art


permalink: /:slug.html

favicon: "/assets/img/favicon.ico" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "hugofloresgarcia" # analytics code belongs to hugofloresgarcia.art — set up a separate GoatCounter site for this domain if wanted

# link-preview (Open Graph / Twitter) image used by jekyll-seo-tag.
# seo-tag reads the image from each page, so set it as a front-matter default.
twitter:
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/preview.png

# theme: riggraz/no-style-please # if you are using GitHub Pages, change it to remote_theme: riggraz/no-style-please
# theme: no-style-please # if you are using GitHub Pages, change it to remote_theme: riggraz/no-style-please

theme_config:
  appearance: "light" # can be "light", "dark" or "auto"
  back_home_text: "← flores electronics" # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

assets:
  css:
    - /assets/css/fun-divider.css
