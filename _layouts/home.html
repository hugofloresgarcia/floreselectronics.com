---
layout: default
---
<style>
  .fe-header { text-align: center; }
  .fe-header h1 { margin-bottom: 0.2rem; }
  .fe-tagline { margin-top: 0; }
  .lang-switch { text-align: center; font-size: 0.85em; margin-top: 0.4rem; }
  .lang-switch a[aria-current="true"] { font-weight: bold; text-decoration: none; }
  /* once JS picks a language, hide the other one (no JS → both languages show) */
  html.lang-en [lang="es"], html.lang-es [lang="en"] { display: none; }
  .fe-links { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 2rem 0; }
  .fe-links a { display: block; padding: 1.2rem 1.6rem; border: thin solid black; font-size: 1.3em; text-align: center; min-width: 12rem; }
  /* three polaroids, loosely scattered. phones: a slightly overlapping stack that
     zig-zags down the page. wider screens: a row, each print at its own tilt.
     the pick-up is a fast 2-frame pop (steps) instead of an ease, early-2000s style. */
  .fe-photos { display: flex; flex-direction: column; margin: 2.5rem 0 3rem; padding: 0; }
  .fe-photos figure {
    --tilt: 0deg; --lift: 0rem;
    margin: 0; width: 72%; max-width: 280px;
    padding: 9px 9px 30px;            /* thicker bottom edge = polaroid */
    background: #fffdf8; border: 1px solid #d9d3c0;
    /* early-2000s drop shadow: hard offset, almost no blur, like the one under an xp window */
    box-shadow: 3px 3px 0 rgba(0,0,0,.22);
    transform: rotate(var(--tilt)) translateY(var(--lift));
  }
  .fe-photos figure + figure { margin-top: -1.4rem; }
  .fe-photos figure:nth-child(1) { align-self: flex-start; margin-left: 4%;  --tilt: -3deg; }
  .fe-photos figure:nth-child(2) { align-self: flex-end;   margin-right: 4%; --tilt: 2.5deg; }
  .fe-photos figure:nth-child(3) { align-self: flex-start; margin-left: 10%; --tilt: -1.5deg; }
  .fe-photos img { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; margin: 0; max-width: none; }
  @media (min-width: 720px) {
    .fe-photos { flex-direction: row; justify-content: center; align-items: flex-start; gap: 0; padding: 1rem 0 2rem; }
    .fe-photos figure { width: 31%; max-width: 250px; }
    .fe-photos figure + figure { margin-top: 0; margin-left: -1.2rem; }
    .fe-photos figure:nth-child(1) { align-self: auto; margin-left: 0;  --tilt: -4deg;   --lift: .6rem; }
    .fe-photos figure:nth-child(2) { align-self: auto; margin-right: 0; --tilt: 2deg;    --lift: -.8rem; z-index: 1; }
    .fe-photos figure:nth-child(3) { align-self: auto; margin-left: -1.2rem; --tilt: -1.5deg; --lift: .9rem; }
  }
  /* pick-up (desktop only, no animation on phones): the print pops to the front and bigger in two quick
     frames, keeping its tilt. the transition lives on the pop state only, so letting go snaps straight back. */
  @media (min-width: 720px) and (hover: hover) {
    .fe-photos figure:hover { z-index: 3; transform: rotate(var(--tilt)) translateY(var(--lift)) scale(1.1); transition: transform .1s steps(2, end); }
  }
  @media (prefers-reduced-motion: reduce) { .fe-photos figure, .fe-photos figure:hover { transition: none; } }
</style>

<header class="fe-header">
  <h1>{{ site.title }}</h1>
  <p class="fe-tagline" lang="en">{{ site.tagline_en }}</p>
  <p class="fe-tagline" lang="es">{{ site.tagline_es }}</p>
  <p class="lang-switch">
    <a href="#" data-lang="en" hreflang="en">english</a> · <a href="#" data-lang="es" hreflang="es">español</a>
  </p>
</header>

{{ content }}

<script>
(function () {
  var root = document.documentElement;
  var links = document.querySelectorAll('.lang-switch a');
  function pick() {
    try { var s = localStorage.getItem('fe-lang'); if (s === 'en' || s === 'es') return s; } catch (e) {}
    return (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
  }
  function apply(l) {
    root.classList.remove('lang-en', 'lang-es');
    root.classList.add('lang-' + l);
    root.setAttribute('lang', l);
    for (var i = 0; i < links.length; i++) {
      links[i].setAttribute('aria-current', links[i].getAttribute('data-lang') === l ? 'true' : 'false');
    }
  }
  apply(pick());
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function (e) {
      e.preventDefault();
      var l = this.getAttribute('data-lang');
      try { localStorage.setItem('fe-lang', l); } catch (e2) {}
      apply(l);
    });
  }
})();
</script>
