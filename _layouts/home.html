---
layout: default
---
<style>
  .fe-header { text-align: center; }
  .fe-header h1 { margin-bottom: 0.2rem; }
  .fe-tagline { margin-top: 0; }
  .lang-switch { text-align: center; font-size: 0.85em; margin-top: 0.4rem; }
  .lang-switch a[aria-current="true"] { font-weight: bold; text-decoration: none; }
  /* once JS picks a language, hide the other one (no JS → both languages show) */
  html.lang-en [lang="es"], html.lang-es [lang="en"] { display: none; }
  .fe-links { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 2rem 0; }
  .fe-links a { display: block; padding: 1.2rem 1.6rem; border: thin solid black; font-size: 1.3em; text-align: center; min-width: 12rem; }
  .fe-photos { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin: 1.5rem 0; }
  .fe-photos figure { margin: 0; width: 100%; max-width: 320px; }
  .fe-photos img { width: 100%; height: auto; }
  .fe-photos figcaption { font-size: 0.8em; text-align: center; }
  .fe-placeholder { border: thin dashed black; padding: 2.5rem 1rem; text-align: center; opacity: 0.6; }
</style>

<header class="fe-header">
  <h1>{{ site.title }}</h1>
  <p class="fe-tagline" lang="en">{{ site.tagline_en }}</p>
  <p class="fe-tagline" lang="es">{{ site.tagline_es }}</p>
  <p class="lang-switch">
    <a href="#" data-lang="en" hreflang="en">english</a> · <a href="#" data-lang="es" hreflang="es">español</a>
  </p>
</header>

{{ content }}

<script>
(function () {
  var root = document.documentElement;
  var links = document.querySelectorAll('.lang-switch a');
  function pick() {
    try { var s = localStorage.getItem('fe-lang'); if (s === 'en' || s === 'es') return s; } catch (e) {}
    return (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
  }
  function apply(l) {
    root.classList.remove('lang-en', 'lang-es');
    root.classList.add('lang-' + l);
    root.setAttribute('lang', l);
    for (var i = 0; i < links.length; i++) {
      links[i].setAttribute('aria-current', links[i].getAttribute('data-lang') === l ? 'true' : 'false');
    }
  }
  apply(pick());
  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function (e) {
      e.preventDefault();
      var l = this.getAttribute('data-lang');
      try { localStorage.setItem('fe-lang', l); } catch (e2) {}
      apply(l);
    });
  }
})();
</script>
